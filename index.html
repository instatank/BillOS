<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0d10" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BillOS" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<title>BillOS</title>
<style>
  :root {
    --bg:            #0b0d10;
    --bg-elev-1:     #12151a;
    --bg-elev-2:     #1a1e25;
    --border:        #232830;
    --text:          #e7ebf0;
    --text-dim:      #9aa3ad;
    --text-muted:    #5f6772;
    --accent:        #7aa2ff;
    --accent-soft:   #2a3a66;
    --danger:        #ef6b6b;
    --warn:          #f0b057;

    --cat-utilities:    #5aa9ff;
    --cat-subscriptions:#b58cff;
    --cat-credit_cards: #f0b057;
    --cat-people:       #6fd28a;
    --cat-other:        #8a93a0;

    --radius: 12px;
    --radius-sm: 8px;
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  a { color: var(--accent); text-decoration: none; }

  .app { max-width: 640px; margin: 0 auto; padding: var(--space-4); }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) 0 var(--space-5); }
  .brand { font-weight: 600; letter-spacing: -0.01em; font-size: 18px; }
  .brand .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: middle; }

  .card { background: var(--bg-elev-1); border: 1px solid var(--border); border-radius: var(--radius); padding: var(--space-5); }
  .muted { color: var(--text-dim); }
  .small { font-size: 13px; }

  button, .btn {
    font: inherit; color: var(--text); background: var(--bg-elev-2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 14px; cursor: pointer; min-height: 44px;
  }
  button:hover { background: #222732; }
  .btn-primary { background: var(--accent); color: #0b0d10; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { filter: brightness(1.05); }

  .center { display: flex; align-items: center; justify-content: center; min-height: 70vh; flex-direction: column; gap: var(--space-4); text-align: center; }

  .stack { display: flex; flex-direction: column; gap: var(--space-3); }
  .row   { display: flex; align-items: center; gap: var(--space-3); }

  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--bg-elev-2); border: 1px solid var(--border);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 600; color: var(--text-dim); overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }

  .userline { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
  .userline .name  { font-weight: 600; }
  .userline .email { color: var(--text-dim); font-size: 13px; }

  .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-dim); }
  .btn-ghost:hover { color: var(--text); background: var(--bg-elev-2); }

  .banner {
    background: rgba(239, 107, 107, 0.08); border: 1px solid rgba(239, 107, 107, 0.35);
    color: var(--danger); padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px;
    text-align: left;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="dot"></span>BillOS</div>
  </header>

  <main id="view-loading" class="center">
    <div class="muted small">Loading…</div>
  </main>

  <main id="view-signed-out" class="center hidden">
    <div class="card stack" style="max-width: 360px; width: 100%;">
      <h1 style="margin: 0; font-size: 20px;">Welcome to BillOS</h1>
      <p class="muted small" style="margin: 0;">Your household's recurring outflows, in one calm place.</p>
      <div id="signInError" class="banner hidden"></div>
      <button id="btnSignIn" class="btn-primary" style="width: 100%;">Sign in with Google</button>
    </div>
  </main>

  <main id="view-signed-in" class="hidden" style="padding-top: var(--space-3);">
    <section class="card stack">
      <div class="row" style="justify-content: space-between;">
        <div class="row">
          <div id="userAvatar" class="avatar"></div>
          <div class="userline">
            <span id="userName"  class="name">—</span>
            <span id="userEmail" class="email">—</span>
          </div>
        </div>
        <button id="btnSignOut" class="btn-ghost small">Sign out</button>
      </div>
    </section>

    <section class="card stack" style="margin-top: var(--space-4);">
      <div class="muted small">You're signed in. Household setup ships in sub-task 3 — for now this is your home.</div>
    </section>
  </main>
</div>

<script type="module">
  // -- Firebase init (replace config before deploy) ----------------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, GoogleAuthProvider,
    signInWithPopup, signOut, browserLocalPersistence, setPersistence
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyCNc_WFupX5qJEULas4_Ovi7wnzsdVoUXY",
    authDomain:        "billos-edd54.firebaseapp.com",
    projectId:         "billos-edd54",
    storageBucket:     "billos-edd54.firebasestorage.app",
    messagingSenderId: "789835550134",
    appId:             "1:789835550134:web:c47369bf01914f53e88517"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);
  await setPersistence(auth, browserLocalPersistence);

  // -- View switching ---------------------------------------------------
  const views = {
    loading:    document.getElementById("view-loading"),
    signedOut:  document.getElementById("view-signed-out"),
    signedIn:   document.getElementById("view-signed-in"),
  };
  function show(name) {
    Object.values(views).forEach(v => v.classList.add("hidden"));
    views[name].classList.remove("hidden");
  }

  // -- Auth: error surfacing -------------------------------------------
  const signInBtn    = document.getElementById("btnSignIn");
  const signInError  = document.getElementById("signInError");
  function showSignInError(msg) {
    if (!msg) { signInError.classList.add("hidden"); signInError.textContent = ""; return; }
    signInError.textContent = msg;
    signInError.classList.remove("hidden");
  }
  function friendlyAuthError(err) {
    const code = err && err.code;
    if (code === "auth/popup-closed-by-user")    return "Sign-in window was closed before finishing. Try again.";
    if (code === "auth/popup-blocked")           return "Your browser blocked the sign-in window. Allow popups for this site and try again.";
    if (code === "auth/cancelled-popup-request") return "Another sign-in is already in progress.";
    if (code === "auth/network-request-failed")  return "You appear to be offline. Reconnect and try again.";
    if (code === "auth/unauthorized-domain")     return "This domain isn't authorized in Firebase. Add it under Authentication → Settings → Authorized domains.";
    return (err && err.message) ? err.message : "Sign-in failed. Please try again.";
  }

  // -- Sign in / sign out ----------------------------------------------
  signInBtn.addEventListener("click", async () => {
    showSignInError(null);
    signInBtn.disabled = true;
    const original = signInBtn.textContent;
    signInBtn.textContent = "Signing in…";
    try {
      await signInWithPopup(auth, new GoogleAuthProvider());
    } catch (err) {
      console.error("[auth] sign-in failed", err);
      showSignInError(friendlyAuthError(err));
    } finally {
      signInBtn.disabled = false;
      signInBtn.textContent = original;
    }
  });

  document.getElementById("btnSignOut").addEventListener("click", async () => {
    try { await signOut(auth); }
    catch (err) { console.error("[auth] sign-out failed", err); alert("Sign out failed. Please try again."); }
  });

  // -- Signed-in card population ---------------------------------------
  const userAvatar = document.getElementById("userAvatar");
  const userName   = document.getElementById("userName");
  const userEmail  = document.getElementById("userEmail");

  function renderUser(user) {
    const name  = user.displayName || "";
    const email = user.email || "";
    userName.textContent  = name || email || "Signed in";
    userEmail.textContent = (name && email) ? email : "";

    userAvatar.innerHTML = "";
    if (user.photoURL) {
      const img = document.createElement("img");
      img.src = user.photoURL;
      img.alt = name || email || "avatar";
      img.referrerPolicy = "no-referrer";
      img.onerror = () => { userAvatar.textContent = (name || email || "?").charAt(0).toUpperCase(); };
      userAvatar.appendChild(img);
    } else {
      userAvatar.textContent = (name || email || "?").charAt(0).toUpperCase();
    }
  }

  onAuthStateChanged(auth, (user) => {
    if (user) { renderUser(user); show("signedIn"); }
    else      { showSignInError(null); show("signedOut"); }
  });

  // -- Service worker ---------------------------------------------------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(err => console.warn("[sw] register failed", err));
    });
  }

  // expose for console debugging during build
  window.__billos = { app, auth, db };
</script>
</body>
</html>
